# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. Перечисленным пакетам он нужен: они собирают нативный модуль,
# и без этого ломается не установка, а запуск.
#
# Ключ именно allowBuilds: поле "pnpm" в package.json 11-я версия игнорирует
# молча.
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  # sharp ставит готовый бинарник. С разрешённым build-скриптом он вместо
  # этого собирается из исходников и требует node-gyp, которого в зависимостях
  # нет, поэтому установка падает.
  sharp: false
