name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
      contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - name: Test
        id: tests
        background: true
        run: mise run test
      - name: Lint
        run: mise run lint
      - name: Wait for tests
        wait: tests

  demo-server:
    runs-on: ubuntu-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - name: Start demo server
        id: server
        background: true
        run: mise run server-demo
      - name: Wait for readiness
        run: curl --fail --retry 60 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 120 http://127.0.0.1:3000/
      - name: Check responces
        run: test "$(curl --fail --silent http://127.0.0.1:3000/)" = ready
      - name: Stop demo server
        cancel: server