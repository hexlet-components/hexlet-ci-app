name: Node CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      # pnpm goes before setup-node: with cache: pnpm the latter looks up an
      # existing pnpm binary to resolve the store path, and without it the job
      # fails with "Unable to locate executable file: pnpm".
      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # BEGIN
      # Set the project up, run the linter and run the tests.
      # END
