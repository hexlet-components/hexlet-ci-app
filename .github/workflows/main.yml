name: CI

on:
  push:
    branches: [main, final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.8
      - run: mise run setup
      - run: mise run lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.8
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ matrix.os }}-pnpm-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-pnpm-v1-
      - run: mise run setup
      - run: mise run test
      - name: Save test report
        if: ${{ !cancelled() && hashFiles('reports/test-results.xml') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: reports/test-results.xml
          retention-days: 7
          if-no-files-found: error

  verify:
    name: CI result
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect reports
        if: ${{ !cancelled() && needs.test.result != 'skipped' }}
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-report-*
          path: reports
      - name: Check all results
        if: ${{ always() }}
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
