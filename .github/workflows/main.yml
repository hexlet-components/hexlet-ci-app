name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [ 26.x ]
    permissions:
      contents: read

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.9
      - run: mise run setup
      - run: mise run lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.9
      - run: mise run setup
      - run: mise run lint

  verify:
    name: CI result
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "All checks passed"